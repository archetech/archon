<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How Archon Works</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root {
    color-scheme: light;
    --paper: #e8ecf1;
    --panel: #f6f8fb;
    --ink: #141d2b;
    --soft: #5b6879;
    --line: #c6cfdb;
    --cobalt: #2a4fc4;
    --amber: #c97a12;
    --bar: #141d2b;
    --bar-text: #e8ecf1;
    --bar-soft: #9aa6b8;
  }
  html, body { background: var(--paper); color: var(--ink); }
  body { margin: 0; font: 15px/1.55 "IBM Plex Sans", system-ui, sans-serif; padding-inline: 16px; padding-block: 28px 48px; }
  .wrap { max-width: 1120px; margin: 0 auto; display: grid; gap: 20px; }
  header h1 { font: 800 clamp(30px, 5vw, 46px)/1.05 "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif; margin: 0; letter-spacing: -0.5px; text-wrap: balance; }
  header p { margin: 8px 0 0; color: var(--soft); max-width: 62ch; }
  header .eyebrow { font: 500 12px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.5px; text-transform: uppercase; color: var(--cobalt); margin: 0 0 8px; }

  .player { border-radius: 14px; overflow: hidden; border: 1px solid var(--line); background: var(--bar); box-shadow: 0 18px 50px -24px rgba(20, 29, 43, .45); outline: none; }
  .player:focus-visible { box-shadow: 0 0 0 3px var(--cobalt); }
  .player:fullscreen { display: flex; flex-direction: column; justify-content: center; border-radius: 0; }
  .player:fullscreen .stage { max-height: calc(100vh - 120px); aspect-ratio: 16 / 9; margin: 0 auto; width: min(100%, calc((100vh - 120px) * 16 / 9)); }
  .stage { position: relative; aspect-ratio: 16 / 9; max-width: 100%; background: var(--paper); }
  canvas { display: block; width: 100%; height: 100%; cursor: pointer; }
  .bigplay { position: absolute; inset: 0; margin: auto; width: 84px; height: 84px; border-radius: 50%; border: 0; background: var(--ink); color: var(--paper); display: grid; place-items: center; cursor: pointer; box-shadow: 0 10px 30px -8px rgba(20, 29, 43, .6); }
  .bigplay svg { width: 30px; height: 30px; margin-left: 4px; }
  .bigplay:focus-visible { outline: 3px solid var(--cobalt); outline-offset: 3px; }

  .caption { min-height: 3.4em; padding: 12px 20px; color: var(--bar-text); font-size: clamp(14px, 1.9vw, 18px); line-height: 1.45; display: flex; align-items: center; justify-content: center; text-align: center; border-bottom: 1px solid rgba(255, 255, 255, .08); }
  .caption span { max-width: 70ch; transition: opacity .25s; }

  .controls { display: flex; align-items: center; gap: 14px; padding: 10px 16px 14px; color: var(--bar-text); }
  .controls button { background: none; border: 0; color: inherit; width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center; cursor: pointer; flex: none; }
  .controls button:hover { background: rgba(255, 255, 255, .08); }
  .controls button:focus-visible { outline: 2px solid #8ea6ff; }
  .controls svg { width: 20px; height: 20px; }
  .time { font: 500 13px "IBM Plex Mono", ui-monospace, monospace; color: var(--bar-soft); font-variant-numeric: tabular-nums; flex: none; }
  .seek { position: relative; flex: 1; min-width: 0; height: 36px; display: flex; align-items: center; }
  .seek input { width: 100%; margin: 0; appearance: none; -webkit-appearance: none; background: transparent; height: 36px; cursor: pointer; position: relative; z-index: 2; }
  .seek input::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: linear-gradient(to right, #8ea6ff var(--pct, 0%), rgba(255, 255, 255, .16) var(--pct, 0%)); }
  .seek input::-moz-range-track { height: 6px; border-radius: 3px; background: linear-gradient(to right, #8ea6ff var(--pct, 0%), rgba(255, 255, 255, .16) var(--pct, 0%)); }
  .seek input::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: #fff; margin-top: -5px; border: 0; }
  .seek input::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: #fff; border: 0; }
  .seek input:focus-visible { outline: 2px solid #8ea6ff; border-radius: 4px; }
  .ticks { position: absolute; inset: 0; pointer-events: none; z-index: 3; }
  .ticks i { position: absolute; top: 15px; width: 2px; height: 6px; background: var(--bar); }

  .chapters { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
  .chapters button { width: 100%; text-align: left; display: flex; gap: 10px; align-items: baseline; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font: inherit; cursor: pointer; }
  .chapters button:hover { border-color: var(--cobalt); }
  .chapters button:focus-visible { outline: 2px solid var(--cobalt); outline-offset: 2px; }
  .chapters button[aria-current="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .chapters .n { font: 500 12px "IBM Plex Mono", ui-monospace, monospace; color: var(--cobalt); font-variant-numeric: tabular-nums; }
  .chapters button[aria-current="true"] .n { color: #8ea6ff; }
  .chapters .t { font-weight: 600; flex: 1; }
  .chapters .d { font: 400 12px "IBM Plex Mono", ui-monospace, monospace; color: var(--soft); font-variant-numeric: tabular-nums; }
  .chapters button[aria-current="true"] .d { color: var(--bar-soft); }

  details { border-top: 1px solid var(--line); padding-top: 14px; }
  summary { cursor: pointer; font-weight: 600; }
  .transcript { max-width: 70ch; }
  .transcript h3 { font: 700 17px "Bricolage Grotesque", system-ui, sans-serif; margin: 18px 0 4px; }
  .transcript p { margin: 0 0 6px; color: var(--soft); }

  @media (max-width: 560px) {
    .controls { gap: 8px; padding-inline: 10px; }
    .time { font-size: 12px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">did:cid · three minutes</p>
    <h1>How Archon works</h1>
    <p>An animated walkthrough of the Archon identity protocol: how a DID is created for free, resolved by anyone, updated with signed operations, and ordered by registries. Everything on screen is drawn live with canvas code.</p>
  </header>

  <div class="player" id="player" tabindex="0" aria-label="Animation player. Space plays or pauses, arrow keys skip.">
    <div class="stage">
      <canvas id="cv" role="img" aria-label="Animated diagram of the Archon identity protocol. The caption below describes each scene."></canvas>
      <button class="bigplay" id="bigplay" aria-label="Play animation" hidden>
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>
      </button>
    </div>
    <div class="caption"><span id="cap"></span></div>
    <div class="controls">
      <button id="pp" aria-label="Play"></button>
      <div class="seek">
        <input type="range" id="seek" min="0" max="180" step="0.05" value="0" aria-label="Seek">
        <div class="ticks" id="ticks"></div>
      </div>
      <span class="time" id="time">0:00 / 3:00</span>
      <button id="fs" aria-label="Full screen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
    </div>
  </div>

  <ol class="chapters" id="chapters"></ol>

  <details>
    <summary>Transcript</summary>
    <div class="transcript" id="transcript"></div>
  </details>
</div>

<script>
(() => {
  // ---------- palette & type ----------
  const W = 1280, H = 720, TOTAL = 180;
  const C = {
    paper: '#e8ecf1', grid: '#dbe1e9', gridB: '#c6cfdb', panel: '#f6f8fb',
    ink: '#141d2b', soft: '#5b6879', faint: '#8c98a8',
    cobalt: '#2a4fc4', cobaltL: '#dde5fb',
    amber: '#c97a12', amberL: '#fbecd3',
    green: '#23835a', greenL: '#d6eee2',
    red: '#c03b28', redL: '#f8dcd6'
  };
  const DISP = '"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif';
  const SANS = '"IBM Plex Sans", system-ui, sans-serif';
  const MONO = '"IBM Plex Mono", ui-monospace, Menlo, monospace';
  const DID = 'did:cid:bafkreig6rjxbv2aopv47dgxhnxepqpb4yrxf2nvzrhmhdqthojfdxuxjbe';
  const CID = DID.slice(8);

  // ---------- math ----------
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const lerp = (a, b, t) => a + (b - a) * t;
  const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const p = (t, a, b) => clamp((t - a) / (b - a));
  const e = (t, a, b) => ease(p(t, a, b));
  const rnd = i => { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
  const hx = c => { const n = parseInt(c.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
  const mix = (a, b, t) => { const A = hx(a), B = hx(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], clamp(t)))).join(',')})`; };
  const B32 = 'abcdefghijklmnopqrstuvwxyz234567';
  const scram = (s, pr, t, seed) => {
    const k = Math.floor(pr * s.length); let out = '';
    for (let i = 0; i < s.length; i++) out += i < k ? s[i] : B32[Math.floor(rnd(seed * 97 + i * 13 + Math.floor(t * 18)) * 32)];
    return out;
  };

  // ---------- canvas ----------
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  let scale = 1;
  function resize() {
    const r = cv.getBoundingClientRect();
    const d = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.max(1, Math.round(r.width * d));
    cv.height = Math.max(1, Math.round(r.width * 9 / 16 * d));
    scale = cv.width / W;
    render();
  }

  // ---------- drawing primitives ----------
  function T(s, x, y, o = {}) {
    const a = o.a ?? 1; if (a <= 0) return;
    ctx.save(); ctx.globalAlpha *= a;
    ctx.font = `${o.w || 400} ${o.s || 16}px ${o.f || SANS}`;
    ctx.fillStyle = o.c || C.ink; ctx.textAlign = o.al || 'left'; ctx.textBaseline = o.b || 'alphabetic';
    if (o.ls) ctx.letterSpacing = o.ls + 'px';
    ctx.fillText(s, x, y); ctx.restore();
  }
  function tw(s, size, font = SANS, weight = 400) { ctx.save(); ctx.font = `${weight} ${size}px ${font}`; const w = ctx.measureText(s).width; ctx.restore(); return w; }
  function box(x, y, w, h, o = {}) {
    const a = o.a ?? 1; if (a <= 0) return;
    ctx.save(); ctx.globalAlpha *= a;
    ctx.beginPath(); ctx.roundRect(x, y, w, h, o.r ?? 10);
    if (o.fill) { ctx.fillStyle = o.fill; ctx.fill(); }
    if (o.stroke) { ctx.strokeStyle = o.stroke; ctx.lineWidth = o.lw || 1.5; if (o.dash) ctx.setLineDash(o.dash); ctx.stroke(); }
    ctx.restore();
  }
  const cbox = (cx, cy, w, h, o) => box(cx - w / 2, cy - h / 2, w, h, o);
  function pop(cx, cy, pr, fn) {
    if (pr <= 0) return;
    ctx.save(); ctx.globalAlpha *= pr;
    const s = lerp(.88, 1, pr);
    ctx.translate(cx, cy); ctx.scale(s, s); ctx.translate(-cx, -cy);
    fn(); ctx.restore();
  }
  function arrowHead(x, y, a, c, s) {
    ctx.beginPath(); ctx.moveTo(x, y);
    ctx.lineTo(x - s * Math.cos(a - .45), y - s * Math.sin(a - .45));
    ctx.lineTo(x - s * Math.cos(a + .45), y - s * Math.sin(a + .45));
    ctx.closePath(); ctx.fillStyle = c; ctx.fill();
  }
  function arrow(x1, y1, x2, y2, pr, o = {}) {
    if (pr <= 0) return;
    const c = o.c || C.ink, x = lerp(x1, x2, pr), y = lerp(y1, y2, pr);
    ctx.save(); ctx.globalAlpha *= (o.a ?? 1);
    ctx.strokeStyle = c; ctx.lineWidth = o.lw || 2; ctx.lineCap = 'round';
    if (o.dash) ctx.setLineDash(o.dash);
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x, y); ctx.stroke(); ctx.setLineDash([]);
    if (o.head !== false) arrowHead(x, y, Math.atan2(y2 - y1, x2 - x1), c, o.hs || 10);
    ctx.restore();
  }
  const qpt = (x1, y1, cx, cy, x2, y2, t) => { const u = 1 - t; return [u * u * x1 + 2 * u * t * cx + t * t * x2, u * u * y1 + 2 * u * t * cy + t * t * y2]; };
  function qarrow(x1, y1, cx, cy, x2, y2, pr, o = {}) {
    if (pr <= 0) return;
    const c = o.c || C.ink, N = 36;
    ctx.save(); ctx.globalAlpha *= (o.a ?? 1);
    ctx.strokeStyle = c; ctx.lineWidth = o.lw || 2; ctx.lineCap = 'round';
    if (o.dash) ctx.setLineDash(o.dash);
    ctx.beginPath(); ctx.moveTo(x1, y1);
    let prev = [x1, y1], cur = prev;
    for (let i = 1; i <= N; i++) { const tt = pr * i / N; prev = cur; cur = qpt(x1, y1, cx, cy, x2, y2, tt); ctx.lineTo(cur[0], cur[1]); }
    ctx.stroke(); ctx.setLineDash([]);
    if (o.head !== false) arrowHead(cur[0], cur[1], Math.atan2(cur[1] - prev[1], cur[0] - prev[0]), c, o.hs || 10);
    ctx.restore();
  }
  function dot(x, y, r, c, a = 1) { if (a <= 0) return; ctx.save(); ctx.globalAlpha *= a; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = c; ctx.fill(); ctx.restore(); }
  function packet(x1, y1, x2, y2, pr, c, r = 6) { if (pr <= 0 || pr >= 1) return; dot(lerp(x1, x2, pr), lerp(y1, y2, pr), r, c); }
  function check(x, y, s, pr, c = C.green) {
    if (pr <= 0) return;
    const a = [x - s * .5, y], b = [x - s * .12, y + s * .38], d = [x + s * .55, y - s * .42];
    ctx.save(); ctx.strokeStyle = c; ctx.lineWidth = s * .2; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(a[0], a[1]);
    const p1 = clamp(pr / .35); ctx.lineTo(lerp(a[0], b[0], p1), lerp(a[1], b[1], p1));
    if (pr > .35) { const p2 = clamp((pr - .35) / .65); ctx.lineTo(lerp(b[0], d[0], p2), lerp(b[1], d[1], p2)); }
    ctx.stroke(); ctx.restore();
  }
  function cross(x, y, s, pr, c = C.red) {
    if (pr <= 0) return;
    ctx.save(); ctx.strokeStyle = c; ctx.lineWidth = s * .22; ctx.lineCap = 'round';
    const p1 = clamp(pr / .5), p2 = clamp((pr - .5) / .5);
    ctx.beginPath(); ctx.moveTo(x - s / 2, y - s / 2); ctx.lineTo(lerp(x - s / 2, x + s / 2, p1), lerp(y - s / 2, y + s / 2, p1));
    if (p2 > 0) { ctx.moveTo(x + s / 2, y - s / 2); ctx.lineTo(lerp(x + s / 2, x - s / 2, p2), lerp(y - s / 2, y + s / 2, p2)); }
    ctx.stroke(); ctx.restore();
  }
  function person(x, y, s, c) {
    ctx.save(); ctx.fillStyle = c;
    ctx.beginPath(); ctx.arc(x, y - s * .28, s * .2, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(x, y + s * .4, s * .36, Math.PI, 0); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  function keyIcon(x, y, s, c) {
    ctx.save(); ctx.strokeStyle = c; ctx.lineWidth = s * .14; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(x, y, s * .3, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x + s * .3, y); ctx.lineTo(x + s * 1.05, y);
    ctx.moveTo(x + s * .75, y); ctx.lineTo(x + s * .75, y + s * .24);
    ctx.moveTo(x + s * .98, y); ctx.lineTo(x + s * .98, y + s * .2);
    ctx.stroke(); ctx.restore();
  }
  function lockIcon(x, y, s, c) {
    ctx.save(); ctx.strokeStyle = c; ctx.fillStyle = c; ctx.lineWidth = s * .13;
    ctx.beginPath(); ctx.arc(x, y - s * .08, s * .26, Math.PI, 0); ctx.stroke();
    ctx.beginPath(); ctx.roundRect(x - s * .42, y - s * .1, s * .84, s * .6, s * .1); ctx.fill();
    ctx.restore();
  }
  function db(x, y, w, h, c) {
    const rx = w / 2, ry = h * .15, top = y - h / 2, bot = y + h / 2;
    ctx.save(); ctx.strokeStyle = c; ctx.lineWidth = 2; ctx.fillStyle = C.panel;
    ctx.beginPath(); ctx.moveTo(x - rx, top + ry); ctx.lineTo(x - rx, bot - ry);
    ctx.ellipse(x, bot - ry, rx, ry, 0, Math.PI, 0, true);
    ctx.lineTo(x + rx, top + ry); ctx.ellipse(x, top + ry, rx, ry, 0, 0, Math.PI, true);
    ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(x, top + ry, rx, ry, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI); ctx.stroke();
    ctx.restore();
  }
  function hexagon(x, y, r, rot, o = {}) {
    ctx.save(); ctx.beginPath();
    for (let i = 0; i < 6; i++) { const a = rot + i * Math.PI / 3; const px = x + r * Math.cos(a), py = y + r * Math.sin(a); i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }
    ctx.closePath();
    if (o.fill) { ctx.fillStyle = o.fill; ctx.fill(); }
    if (o.stroke) { ctx.strokeStyle = o.stroke; ctx.lineWidth = o.lw || 2; ctx.stroke(); }
    ctx.restore();
  }
  function pill(cx, cy, text, o = {}) {
    const s = o.s || 15, pad = o.pad || 14, w = tw(text, s, o.f || SANS, o.w || 600) + pad * 2, h = s + 16;
    pop(cx, cy, o.pr ?? 1, () => {
      cbox(cx, cy, w, h, { fill: o.bg || C.panel, stroke: o.stroke || C.gridB, r: h / 2 });
      T(text, cx, cy + 1, { s, w: o.w || 600, f: o.f || SANS, c: o.c || C.ink, al: 'center', b: 'middle' });
    });
  }
  function codeLine(s, x, y, n, fs) {
    const re = /("(?:[^"\\]|\\.)*"\s*:)|("(?:[^"\\]|\\.)*")|([{}\[\],])|(\b\d+\b)|([^"{}\[\],]+?(?=["{}\[\],]|\b\d+\b|$))/g;
    ctx.save(); ctx.font = `400 ${fs}px ${MONO}`; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    let m, cx = x, used = 0;
    while ((m = re.exec(s)) && used < n) {
      if (!m[0]) { re.lastIndex++; continue; }
      const tok = m[0];
      ctx.fillStyle = m[1] ? C.soft : m[2] ? C.cobalt : m[3] ? C.faint : m[4] ? C.amber : C.ink;
      const show = tok.slice(0, n - used); used += tok.length;
      ctx.fillText(show, cx, y); cx += ctx.measureText(show).width;
    }
    ctx.restore();
  }
  function card(x, y, w, title, lines, pr, o = {}) {
    const fs = o.fs || 14, lh = o.lh || 22, top = 30 + 24;
    const h = top + (lines.length - 1) * lh + 18;
    const ly = i => y + top + i * lh;
    ctx.save(); ctx.globalAlpha *= (o.a ?? 1);
    box(x, y, w, h, { fill: C.panel, stroke: C.gridB, r: 12 });
    ctx.beginPath(); ctx.roundRect(x, y, w, 30, [12, 12, 0, 0]); ctx.fillStyle = o.hc || C.ink; ctx.fill();
    T(title.toUpperCase(), x + 16, y + 20, { f: MONO, s: 12, w: 500, c: C.paper, ls: 1.2 });
    let n = Math.floor(pr * lines.reduce((a, l) => a + l.length, 0));
    lines.forEach((l, i) => {
      const hl = o.hl && o.hl[i];
      if (hl && hl[1] > 0) { ctx.save(); ctx.globalAlpha *= hl[1]; ctx.fillStyle = hl[0]; ctx.fillRect(x + 6, ly(i) - fs - 2, w - 12, lh); ctx.restore(); }
      if (n > 0) { codeLine(l, x + 16, ly(i), n, fs); n -= l.length; }
    });
    ctx.restore();
    return { h, ly };
  }

  // ---------- ambient network ----------
  const NET = Array.from({ length: 46 }, (_, i) => ({ x: rnd(i * 3 + 1) * W, y: rnd(i * 3 + 2) * H, ph: rnd(i * 3 + 3) * 6.28 }));
  function network(t, a) {
    if (a <= 0) return;
    ctx.save(); ctx.globalAlpha *= a;
    const P = NET.map(q => [q.x + Math.sin(t * .3 + q.ph) * 16, q.y + Math.cos(t * .25 + q.ph) * 12]);
    ctx.lineWidth = 1;
    for (let i = 0; i < P.length; i++) for (let j = i + 1; j < P.length; j++) {
      const d = Math.hypot(P[i][0] - P[j][0], P[i][1] - P[j][1]);
      if (d < 175) { ctx.strokeStyle = `rgba(90,110,140,${(1 - d / 175) * .45})`; ctx.beginPath(); ctx.moveTo(P[i][0], P[i][1]); ctx.lineTo(P[j][0], P[j][1]); ctx.stroke(); }
    }
    P.forEach((q, i) => dot(q[0], q[1], i % 7 === 0 ? 4 : 2.5, i % 7 === 0 ? C.cobalt : C.faint, .8));
    ctx.restore();
  }

  function background() {
    ctx.fillStyle = C.paper; ctx.fillRect(0, 0, W, H);
    ctx.lineWidth = 1;
    for (let x = 0; x <= W; x += 40) { ctx.strokeStyle = x % 200 === 0 ? C.gridB : C.grid; ctx.globalAlpha = x % 200 === 0 ? .5 : .55; ctx.beginPath(); ctx.moveTo(x + .5, 0); ctx.lineTo(x + .5, H); ctx.stroke(); }

  const ICON_PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>';
  const ICON_PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4.5" width="4" height="15" rx="1"/><rect x="14" y="4.5" width="4" height="15" rx="1"/></svg>';
  const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;

  const chapList = $('chapters');
  SCENES.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<button type="button"><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t"></span><span class="d">${fmt(s.start)}</span></button>`;
    li.querySelector('.t').textContent = s.title;
    li.querySelector('button').addEventListener('click', () => { t = s.start; if (!playing) setPlaying(true); sync(); });
    chapList.appendChild(li);
    if (i) { const tick = document.createElement('i'); tick.style.left = `calc(${s.start / TOTAL * 100}% - 1px)`; $('ticks').appendChild(tick); }
  });
  const chapBtns = [...chapList.querySelectorAll('button')];

  const tr = $('transcript');
  SCENES.forEach((s, i) => {
    const h = document.createElement('h3'); h.textContent = `${String(i + 1).padStart(2, '0')} · ${s.title}`; tr.appendChild(h);
    CUES.filter(c => c[0] >= s.start && c[0] < s.start + s.dur).forEach(c => { const pEl = document.createElement('p'); pEl.textContent = c[2]; tr.appendChild(pEl); });
  });

  let lastCue = -1, lastChap = -1;
  function sync() {
    seek.value = t.toFixed(2);
    seek.style.setProperty('--pct', (t / TOTAL * 100) + '%');
    timeEl.textContent = `${fmt(t)} / ${fmt(TOTAL)}`;
    const ci = CUES.findIndex(c => t >= c[0] && t < c[1]);
    const cue = ci < 0 ? CUES.length - 1 : ci;
    if (cue !== lastCue) { cap.textContent = CUES[cue][2]; lastCue = cue; }
    const ch = SCENES.findIndex(s => t >= s.start && t < s.start + s.dur);
    const chap = ch < 0 ? SCENES.length - 1 : ch;
    if (chap !== lastChap) { chapBtns.forEach((b, i) => b.setAttribute('aria-current', i === chap ? 'true' : 'false')); lastChap = chap; }
    render();
  }
  function setPlaying(v) {
    if (v && t >= TOTAL - .01) t = 0;
    playing = v; last = performance.now();
    pp.innerHTML = v ? ICON_PAUSE : ICON_PLAY;
    pp.setAttribute('aria-label', v ? 'Pause' : 'Play');
    big.hidden = v;
    big.setAttribute('aria-label', t > 0 ? 'Resume animation' : 'Play animation');
  }
  function frame(now) {
    if (playing) {
      t = Math.min(TOTAL, t + Math.min(.1, (now - last) / 1000));
      if (t >= TOTAL) setPlaying(false);
      sync();
    }
    last = now;
    requestAnimationFrame(frame);
  }

  pp.addEventListener('click', () => setPlaying(!playing));
  big.addEventListener('click', () => setPlaying(true));
  cv.addEventListener('click', () => setPlaying(!playing));
  seek.addEventListener('input', () => { t = parseFloat(seek.value); sync(); });
  player.addEventListener('keydown', ev => {
    if (ev.target === seek) return;
    if (ev.key === ' ' || ev.key === 'k') { ev.preventDefault(); setPlaying(!playing); }
    else if (ev.key === 'ArrowRight') { ev.preventDefault(); t = Math.min(TOTAL, t + 5); sync(); }
    else if (ev.key === 'ArrowLeft') { ev.preventDefault(); t = Math.max(0, t - 5); sync(); }
  });
  $('fs').addEventListener('click', () => {
    try {
      if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
      else if (player.requestFullscreen) player.requestFullscreen().catch(() => {});
    } catch (_) {}
  });
  document.addEventListener('fullscreenchange', () => requestAnimationFrame(resize));
  new ResizeObserver(() => resize()).observe(cv);

  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const fontsReady = document.fonts ? Promise.race([
    Promise.all([
      document.fonts.load(`800 40px ${DISP}`), document.fonts.load(`700 40px ${DISP}`),
      document.fonts.load(`400 16px ${SANS}`), document.fonts.load(`600 16px ${SANS}`),
      document.fonts.load(`400 16px ${MONO}`), document.fonts.load(`500 16px ${MONO}`)
    ]),
    new Promise(r => setTimeout(r, 2000))
  ]).catch(() => {}) : Promise.resolve();

  setPlaying(false);
  resize(); sync();
  fontsReady.then(() => {
    sync();
    if (reduce) { t = 6; sync(); big.hidden = false; }
    else setPlaying(true);
    requestAnimationFrame(frame);
  });
})();
</script>
</body>
</html>
