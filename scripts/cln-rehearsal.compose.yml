# Override for scripts/cln-migration-rehearsal.sh: runs the bundled Lightning
# services on regtest against the rehearsal's bitcoind, with no host ports, so
# it can run beside a live node. Paths are relative to the repository root.

x-regtest-socket: &regtest-socket
  # The rune containers read the mainnet socket and certificate paths.
  volumes:
    - ./data/cln-mainnet/regtest/regtest:/data/lightning/bitcoin/bitcoin

services:
  cln-mainnet-node:
    image: ${CLN_IMAGE}
    environment:
      - NETWORK=regtest
      - BITCOIN_RPCHOST=${REHEARSAL_BITCOIND}
      - BITCOIN_RPCPORT=18443
      - BITCOIN_RPCUSER=u
      - BITCOIN_RPCPASSWORD=p
    ports: !reset []
    networks:
      - rehearsal

  drawbridge-init:
    image: ${CLN_IMAGE}
    <<: *regtest-socket

  rtl-init:
    image: ${CLN_IMAGE}
    <<: *regtest-socket

  lnbits-init:
    image: ${CLN_IMAGE}
    <<: *regtest-socket

  tor:
    image: ${TOR_IMAGE:-ghcr.io/archetech/tor}
    ports: !reset []

networks:
  rehearsal:
    name: cln-rehearsal
    external: true
