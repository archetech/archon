name: Python keymaster unit tests

on:
    pull_request:

# Superseding pushes make earlier runs irrelevant: only the head commit's checks
# gate a merge. Cancelling them on branches keeps a rapidly-iterated PR from
# holding runners for commits nobody will merge. main is never cancelled, so its
# builds and scans always complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
    # Documentation-only changes skip the tests below; the required job then
    # reports as skipped, which branch protection accepts. It runs unless
    # detection succeeded and said otherwise, so a failed detection cannot skip
    # it. See scripts/ci-affected.sh.
    changes:
        runs-on: ubuntu-latest
        outputs:
            unit: ${{ steps.affected.outputs.unit }}
        steps:
            - name: Check out repository
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
              with:
                  fetch-depth: 0

            - name: Detect affected jobs
              id: affected
              run: scripts/ci-affected.sh >> "$GITHUB_OUTPUT"

    test_python_keymaster:
        needs: changes
        if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.unit != 'false') }}
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

            - name: Set up Python
              uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
              with:
                  python-version: "3.12"

            - name: Install keymaster library
              working-directory: ./python/keymaster
              run: |
                  python -m pip install --upgrade pip
                  pip install -e .
                  pip install pytest pytest-asyncio

            - name: Run keymaster unit tests
              working-directory: ./python/keymaster
              run: |
                  pytest -q tests

            - name: Install keymaster_service
              working-directory: ./python/keymaster_service
              run: |
                  pip install -e .

            - name: Run keymaster_service unit tests
              working-directory: ./python/keymaster_service
              run: |
                  pytest -q tests

            - name: Smoke test keymaster CLI
              run: |
                  keymaster --help > /dev/null
