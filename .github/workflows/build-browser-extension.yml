name: Build Browser Extension

on:
  push:
    # Not required checks, so a workflow-level filter is safe; see
    # scripts/ci-affected.sh for what documentation-only means.
    paths-ignore:
      - '**.md'
      - 'deploy/**'

# Superseding pushes make earlier runs irrelevant: only the head commit's checks
# gate a merge. Cancelling them on branches keeps a rapidly-iterated PR from
# holding runners for commits nobody will merge. main is never cancelled, so its
# builds and scans always complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-browser-extension:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Use Node 22.23.4
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.23.4'

      - name: Pin npm 10.9.2
        run: npm install --global npm@10.9.2

      - name: Install root dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run build

      - name: Install extension dependencies
        run: |
          cd ./apps/browser-extension
          npm ci

      - name: Typecheck extension
        run: |
          cd ./apps/browser-extension
          npm run typecheck

      - name: Render tests
        run: |
          cd ./apps/browser-extension
          npm test

      # The packaging a release runs, so a fault in it shows up before a tag does.
      - name: Build and package the extensions
        run: ./apps/browser-extension/scripts/package-release.sh
