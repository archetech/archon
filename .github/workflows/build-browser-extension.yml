name: Build Browser Extension

on:
  push:

# Superseding pushes make earlier runs irrelevant: only the head commit's checks
# gate a merge. Cancelling them on branches keeps a rapidly-iterated PR from
# holding runners for commits nobody will merge. main is never cancelled, so its
# builds and scans always complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-browser-extension:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Use Node 22.23.2
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.2'

      - name: Pin npm 10.9.2
        run: npm install --global npm@10.9.2

      - name: Install root dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run build

      - name: Install extension dependencies
        run: |
          cd ./apps/browser-extension
          npm ci

      - name: Typecheck extension
        run: |
          cd ./apps/browser-extension
          npm run typecheck

      - name: Render tests
        run: |
          cd ./apps/browser-extension
          npm test

      - name: Build Chrome extension
        run: |
          cd ./apps/browser-extension
          npm run build:chrome

      - name: Build Firefox extension
        run: |
          cd ./apps/browser-extension
          npm run build:firefox
