name: unit-test

on:
  push:
    branches:
      - "**"

# Superseding pushes make earlier runs irrelevant: only the head commit's checks
# gate a merge. Cancelling them on branches keeps a rapidly-iterated PR from
# holding runners for commits nobody will merge. main is never cancelled, so its
# builds and scans always complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # npm test runs jest --runInBand without --forceExit, so a leaked handle
    # keeps the job alive rather than failing it. Without a bound that runs to
    # the six-hour default.
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22.23.4"

      - name: Pin npm 10.9.2
        run: npm install --global npm@10.9.2

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run build

      - name: Run ESLint
        run: npm run lint

      # tsconfig.json covers tests/, but nothing ran tsc over it: the build
      # script compiles the workspace packages only, and isolatedModules means
      # ts-jest transpiles per file without cross-file checking. So a test
      # fixture typed against a production interface was a guard nothing
      # enforced, and 416 errors had accumulated unseen (#923).
      - name: Typecheck tests
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test:ci:unit

      # In-process DIDComm relay e2e, run isolated (out of the unit suite) so its
      # real sockets can't trip "import after teardown" in the shared run.
      - name: Run DIDComm relay e2e (isolated)
        run: npm run test:didcomm-e2e

      - name: Upload unit coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: unit-jest-coverage
          path: coverage/coverage-final.json
          if-no-files-found: error

  convergence-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22.23.4"

      - name: Pin npm 10.9.2
        run: npm install --global npm@10.9.2

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run build

      - name: Run convergence tests
        run: npm run test:ci:convergence

      - name: Upload convergence coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: convergence-jest-coverage
          path: coverage/coverage-final.json
          if-no-files-found: error

  # The shared wallet UI (packages/wallet-ui) is exercised only by the
  # react-wallet vitest render tests, so its coverage is collected there and
  # merged below with the Jest reports.
  wallet-ui-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22.23.4"

      - name: Pin npm 10.9.2
        run: npm install --global npm@10.9.2

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run build

      - name: Install react-wallet dependencies
        working-directory: ./apps/react-wallet
        run: npm ci

      - name: Run render tests with coverage
        working-directory: ./apps/react-wallet
        run: npm run test:coverage

      - name: Upload wallet-ui coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: wallet-ui-vitest-coverage
          path: apps/react-wallet/coverage/coverage-final.json
          if-no-files-found: error

  coverage:
    needs: [build-and-test, convergence-tests, wallet-ui-coverage]
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22.23.4"

      - name: Pin npm 10.9.2
        run: npm install --global npm@10.9.2

      - name: Install dependencies
        run: npm ci

      - name: Download unit coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: unit-jest-coverage
          path: coverage-parts/unit

      - name: Download convergence coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: convergence-jest-coverage
          path: coverage-parts/convergence

      - name: Download wallet-ui coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: wallet-ui-vitest-coverage
          path: coverage-parts/wallet-ui

      - name: Merge coverage
        run: node scripts/merge-coverage.mjs coverage-parts/unit/coverage-final.json coverage-parts/convergence/coverage-final.json coverage-parts/wallet-ui/coverage-final.json

      - name: Generate Code Coverage report
        id: code-coverage
        uses: barecheck/code-coverage-action@d92cdaec187f89f0886ccec37acf11e2a6a85f70
        with:
          barecheck-github-app-token: ${{ secrets.BARECHECK_GITHUB_APP_TOKEN }}
          lcov-file: "./coverage/lcov.info"
          send-summary-comment: true
          show-annotations: "warning"

      - name: Coveralls GitHub Action
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329
        continue-on-error: true
