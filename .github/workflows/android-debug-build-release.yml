name: Attach Release Assets

# Superseding pushes make earlier runs irrelevant: only the head commit's checks
# gate a merge. Cancelling them on branches keeps a rapidly-iterated PR from
# holding runners for commits nobody will merge. main is never cancelled, so its
# builds and scans always complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: write

on:
  push:
    tags: ["*"]

jobs:
  build-android-debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Use Node 22.23.4
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22.23.4"

      - name: Pin npm 10.9.2
        run: npm install --global npm@10.9.2

      - name: Install root dependencies
        run: npm ci

      - name: Build shared packages
        run: npm run build

      - name: Install app dependencies
        working-directory: ./apps/react-wallet
        run: npm ci

      - name: Set up Java 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd

      - name: Decode signing keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > ${{ github.workspace }}/archon-debug.keystore

      - name: Build Android debug APK
        working-directory: ./apps/react-wallet
        env:
          CI: true
          ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/archon-debug.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: npm run android:build

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: app-debug-artifact
          path: apps/react-wallet/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  create-release:
    runs-on: ubuntu-latest
    needs: build-android-debug
    if: github.ref_type == 'tag'
    steps:
      - name: Download debug APK artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: app-debug-artifact

      # The downloaded artifact will be in the repository root
      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3
        with:
          files: app-debug.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-browser-extensions:
    runs-on: ubuntu-latest
    # Tags also mark npm packages (@didcid/cipher@0.6.0), which don't version these.
    if: startsWith(github.ref_name, 'v')
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Use Node 22.23.4
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22.23.4"

      - name: Pin npm 10.9.2
        run: npm install --global npm@10.9.2

      - name: Install root dependencies
        run: npm ci

      - name: Build shared packages
        run: npm run build

      - name: Install extension dependencies
        working-directory: ./apps/browser-extension
        run: npm ci

      - name: Build and package the extensions
        run: ./apps/browser-extension/scripts/package-release.sh "$GITHUB_REF_NAME"

      - name: Upload the packaged extensions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: browser-extensions
          path: apps/browser-extension/build/*.zip
          if-no-files-found: error

  # After create-release, so the two don't race to create the release, and apart from
  # it, so a failed extension build doesn't cost the release its APK.
  attach-browser-extensions:
    runs-on: ubuntu-latest
    needs: [create-release, build-browser-extensions]
    steps:
      - name: Download the packaged extensions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: browser-extensions

      - name: Upload the extensions to the release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3
        with:
          files: archon-wallet-*.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
