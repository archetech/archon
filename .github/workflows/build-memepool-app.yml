name: Build Memepool app

on:
  push:
    # Not a required check, so a workflow-level filter is safe; see
    # scripts/ci-affected.sh for what documentation-only means.
    paths-ignore:
      - '**.md'
      - 'deploy/**'

# Superseding pushes make earlier runs irrelevant: only the head commit's checks
# gate a merge. main is never cancelled, so its builds always complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-memepool-app:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Use Node 22.23.4
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.23.4'

      - name: Pin npm 10.9.2
        run: npm install --global npm@10.9.2

      # The app uses none of the repository's packages, so it needs no root
      # install and no package build.
      - name: Install dependencies
        working-directory: ./apps/memepool
        run: npm ci

      - name: Typecheck
        working-directory: ./apps/memepool
        run: npx tsc --noEmit -p tsconfig.json

      - name: Render tests
        working-directory: ./apps/memepool
        run: npm test

      - name: Build
        working-directory: ./apps/memepool
        run: npm run build
