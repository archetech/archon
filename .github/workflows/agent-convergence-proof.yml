name: agent-convergence-proof

on:
  pull_request:
    paths:
      - 'proofs/agent-convergence/**'
      - 'tests/convergence/**'
      - 'tests/gatekeeper/hyperswarm-time-vectors.json'
      - 'packages/common/**'
      - 'packages/cipher/**'
      - 'packages/ipfs/**'
      - 'packages/gatekeeper/**'
      - 'tests/gatekeeper/convergence.test.ts'
      - 'tests/gatekeeper/event-targets.test.ts'
      - 'tests/gatekeeper/method-ids.test.ts'
      - 'tests/gatekeeper/successor-ordering.test.ts'
      - 'tests/gatekeeper/event-policy.test.ts'
      - 'tests/gatekeeper/agent-convergence.test.ts'
      - 'tests/gatekeeper/chain-convergence.test.ts'
      - 'tests/gatekeeper/chain-successors.test.ts'
      - 'tests/gatekeeper/controller-view.test.ts'
      - 'tests/gatekeeper/chain-ordinals.test.ts'
      - 'tests/gatekeeper/interleaved-replay.test.ts'
      - 'tests/gatekeeper/integrated-agent.test.ts'
      - 'tests/gatekeeper/asset-convergence.test.ts'
      - 'tests/gatekeeper/pin-receipt-audit.test.ts'
      - 'tests/gatekeeper/local-receipt-audit.test.ts'
      - 'tests/gatekeeper/local-registration-audit.test.ts'
      - 'tests/gatekeeper/chain-registration-audit.test.ts'
      - 'rust/services/gatekeeper/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/agent-convergence-proof.yml'
  push:
    branches: [main]
    paths:
      - 'proofs/agent-convergence/**'
      - 'tests/convergence/**'
      - 'tests/gatekeeper/hyperswarm-time-vectors.json'
      - 'packages/common/**'
      - 'packages/cipher/**'
      - 'packages/ipfs/**'
      - 'packages/gatekeeper/**'
      - 'tests/gatekeeper/convergence.test.ts'
      - 'tests/gatekeeper/event-targets.test.ts'
      - 'tests/gatekeeper/method-ids.test.ts'
      - 'tests/gatekeeper/successor-ordering.test.ts'
      - 'tests/gatekeeper/event-policy.test.ts'
      - 'tests/gatekeeper/agent-convergence.test.ts'
      - 'tests/gatekeeper/chain-convergence.test.ts'
      - 'tests/gatekeeper/chain-successors.test.ts'
      - 'tests/gatekeeper/controller-view.test.ts'
      - 'tests/gatekeeper/chain-ordinals.test.ts'
      - 'tests/gatekeeper/interleaved-replay.test.ts'
      - 'tests/gatekeeper/integrated-agent.test.ts'
      - 'tests/gatekeeper/asset-convergence.test.ts'
      - 'tests/gatekeeper/pin-receipt-audit.test.ts'
      - 'tests/gatekeeper/local-receipt-audit.test.ts'
      - 'tests/gatekeeper/local-registration-audit.test.ts'
      - 'tests/gatekeeper/chain-registration-audit.test.ts'
      - 'rust/services/gatekeeper/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/agent-convergence-proof.yml'
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
    inputs:
      clean:
        description: 'Build proofs without restoring the Lean build cache'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  lean-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.2'
      - name: Install pinned Elan manager
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/archon-elan"
          gh release download v4.2.4 --repo leanprover/elan --pattern elan-x86_64-unknown-linux-gnu.tar.gz --dir "$RUNNER_TEMP/archon-elan"
          (cd "$RUNNER_TEMP/archon-elan" && sha256sum --check "$GITHUB_WORKSPACE/proofs/agent-convergence/elan-v4.2.4-linux-x86_64.sha256")
          tar -xzf "$RUNNER_TEMP/archon-elan/elan-x86_64-unknown-linux-gnu.tar.gz" -C "$RUNNER_TEMP/archon-elan"
          "$RUNNER_TEMP/archon-elan/elan-init" -y --no-modify-path --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Regenerate signed source vectors
        run: |
          npm install --global npm@10.9.2
          npm ci
          npm run build -w @didcid/common
          npm run build -w @didcid/cipher
          npm run build -w @didcid/ipfs
          node tests/convergence/generate-vectors.mjs
          node tests/convergence/generate-agent-vectors.mjs
          node tests/convergence/generate-document-vectors.mjs
          node tests/convergence/generate-component-vectors.mjs
          node tests/convergence/generate-chain-anchor-vectors.mjs
          node tests/convergence/generate-chain-successor-vectors.mjs
          node tests/convergence/generate-chain-document-vectors.mjs
          node tests/convergence/generate-migration-vectors.mjs
          node tests/convergence/generate-tied-anchor-vectors.mjs
          node tests/convergence/generate-controller-view-vectors.mjs
          node tests/convergence/generate-integrated-agent-vectors.mjs
          node tests/convergence/generate-asset-vectors.mjs
          node tests/convergence/generate-pin-receipt-counterexample.mjs
          node tests/convergence/generate-event-target-vectors.mjs
          node tests/convergence/generate-method-id-vectors.mjs
          git diff --exit-code -- tests/convergence/vectors.json tests/convergence/agent-vectors.json tests/convergence/document-vectors.json tests/convergence/component-vectors.json tests/convergence/chain-anchor-vectors.json tests/convergence/chain-successor-vectors.json tests/convergence/chain-document-vectors.json tests/convergence/migration-vectors.json tests/convergence/tied-anchor-vectors.json tests/convergence/controller-view-vectors.json tests/convergence/integrated-agent-vectors.json tests/convergence/pin-receipt-counterexample.json tests/convergence/asset-vectors.json tests/convergence/event-target-vectors.json tests/convergence/method-id-vectors.json
      - name: Check shared fixture bridge
        run: |
          node --test proofs/agent-convergence/generate-fixtures.test.mjs proofs/agent-convergence/generate-agent-fixtures.test.mjs proofs/agent-convergence/generate-document-fixtures.test.mjs proofs/agent-convergence/generate-component-fixtures.test.mjs proofs/agent-convergence/generate-chain-anchor-fixtures.test.mjs proofs/agent-convergence/generate-chain-successor-fixtures.test.mjs proofs/agent-convergence/generate-interleaved-fixtures.test.mjs proofs/agent-convergence/generate-priority-fixtures.test.mjs proofs/agent-convergence/generate-interleaved-document-fixtures.test.mjs proofs/agent-convergence/generate-chain-document-fixtures.test.mjs proofs/agent-convergence/generate-registry-fixtures.test.mjs proofs/agent-convergence/generate-registry-interleaved-fixtures.test.mjs tests/convergence/migration-model.test.mjs proofs/agent-convergence/generate-integrated-agent-fixtures.test.mjs proofs/agent-convergence/generate-asset-fixtures.test.mjs proofs/agent-convergence/generate-protocol-fixtures.test.mjs
          node proofs/agent-convergence/generate-fixtures.mjs --check
          node proofs/agent-convergence/generate-record-fixtures.mjs --check
          node proofs/agent-convergence/generate-agent-fixtures.mjs --check
          node proofs/agent-convergence/generate-document-fixtures.mjs --check
          node proofs/agent-convergence/generate-component-fixtures.mjs --check
          node proofs/agent-convergence/generate-chain-anchor-fixtures.mjs --check
          node proofs/agent-convergence/generate-chain-successor-fixtures.mjs --check
          node proofs/agent-convergence/generate-interleaved-fixtures.mjs --check
          node proofs/agent-convergence/generate-priority-fixtures.mjs --check
          node proofs/agent-convergence/generate-interleaved-document-fixtures.mjs --check
          node proofs/agent-convergence/generate-chain-document-fixtures.mjs --check
          node proofs/agent-convergence/generate-registry-fixtures.mjs --check
          node proofs/agent-convergence/generate-registry-interleaved-fixtures.mjs --check
          node proofs/agent-convergence/generate-integrated-agent-fixtures.mjs --check
          node proofs/agent-convergence/generate-asset-fixtures.mjs --check
          node proofs/agent-convergence/generate-protocol-fixtures.mjs --check
          node tests/convergence/generate-local-receipt-counterexample.mjs
          node tests/convergence/generate-local-registration-counterexample.mjs
          node tests/convergence/generate-chain-registration-counterexample.mjs
          git diff --exit-code -- tests/convergence/local-receipt-counterexample.json tests/convergence/local-registration-counterexample.json tests/convergence/chain-registration-counterexample.json
      # Restore only after mandatory source/fixture freshness checks. Lake still
      # checks dependency traces and rebuilds changed modules on every run.
      - name: Cache compiled proof modules
        if: github.event_name != 'schedule' && inputs.clean != true
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: proofs/agent-convergence/.lake/build
          key: lean-proof-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('proofs/agent-convergence/lean-toolchain', '.github/workflows/agent-convergence-proof.yml') }}-${{ hashFiles('proofs/agent-convergence/**/*.lean', 'proofs/agent-convergence/lakefile.toml', 'proofs/agent-convergence/lake-manifest.json') }}
          restore-keys: |
            lean-proof-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('proofs/agent-convergence/lean-toolchain', '.github/workflows/agent-convergence-proof.yml') }}-
      - name: Check proofs and concrete histories
        working-directory: proofs/agent-convergence
        run: |
          lake build
          # Execute the axiom audit even when its compiled module was restored.
          lake env lean AxiomAudit.lean
      - name: Check reordered signed protocol bridge with Lean
        run: node proofs/agent-convergence/check-protocol-reordering.mjs

  typescript-replay-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.2'
      - name: Build signed-fixture dependencies
        run: |
          npm install --global npm@10.9.2
          npm ci
          npm run build -w @didcid/common
          npm run build -w @didcid/cipher
          npm run build -w @didcid/ipfs
      - name: Check TypeScript replay pass bridge
        run: node --experimental-vm-modules node_modules/.bin/jest tests/gatekeeper/convergence.test.ts --runInBand --coverage=false -t 'Lean-checked'
      - name: Check signed agent authorization
        run: node --experimental-vm-modules node_modules/.bin/jest tests/gatekeeper/agent-convergence.test.ts --runInBand --coverage=false
      - name: Check repeated chain anchors
        run: node --experimental-vm-modules node_modules/.bin/jest tests/gatekeeper/chain-convergence.test.ts tests/gatekeeper/chain-successors.test.ts tests/gatekeeper/controller-view.test.ts tests/gatekeeper/chain-ordinals.test.ts tests/gatekeeper/interleaved-replay.test.ts tests/gatekeeper/integrated-agent.test.ts tests/gatekeeper/pin-receipt-audit.test.ts tests/gatekeeper/local-receipt-audit.test.ts tests/gatekeeper/local-registration-audit.test.ts tests/gatekeeper/chain-registration-audit.test.ts tests/gatekeeper/event-targets.test.ts tests/gatekeeper/method-ids.test.ts tests/gatekeeper/successor-ordering.test.ts tests/gatekeeper/event-policy.test.ts --runInBand --coverage=false
      - name: Check signed asset reconciliation and durable restart
        run: node --experimental-vm-modules node_modules/.bin/jest tests/gatekeeper/asset-convergence.test.ts --runInBand --coverage=false --silent

  rust-replay-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Install production Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --no-self-update
      - name: Check Rust signed convergence and replay pass bridge
        run: |
          cargo +1.90.0 test --locked --manifest-path rust/services/gatekeeper/Cargo.toml --lib convergence::

  # Preserve one aggregate result for the complete proof/implementation bridge.
  prove:
    if: always()
    needs: [lean-proof, typescript-replay-bridge, rust-replay-bridge]
    runs-on: ubuntu-latest
    steps:
      - name: Require all proof and bridge checks
        env:
          LEAN_RESULT: ${{ needs.lean-proof.result }}
          TYPESCRIPT_RESULT: ${{ needs.typescript-replay-bridge.result }}
          RUST_RESULT: ${{ needs.rust-replay-bridge.result }}
        run: |
          test "$LEAN_RESULT" = success
          test "$TYPESCRIPT_RESULT" = success
          test "$RUST_RESULT" = success
