name: Dependency Review

on:
  pull_request:

# Superseding pushes make earlier runs irrelevant: only the head commit's checks
# gate a merge. Cancelling them on branches keeps a rapidly-iterated PR from
# holding runners for commits nobody will merge. main is never cancelled, so its
# builds and scans always complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Review dependency changes
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec
        with:
          fail-on-severity: moderate
