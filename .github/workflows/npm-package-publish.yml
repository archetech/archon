name: Publish to NPM

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package to publish"
        required: true
        type: choice
        options:
          - "all"
          - "@didcid/cipher"
          - "@didcid/common"
          - "@didcid/gatekeeper"
          - "@didcid/ipfs"
          - "@didcid/keymaster"
      version:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - current
          - patch
          - minor
          - major
          - prepatch
          - preminor
          - premajor
          - prerelease
      preid:
        description: "Pre-release identifier"
        required: false
        default: "beta"
        type: choice
        options:
          - beta
          - alpha
          - rc

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout current release tags
        if: ${{ github.event.inputs.version == 'current' }}
        run: |
          PACKAGE="${{ github.event.inputs.package }}"
          if [ "$PACKAGE" = "all" ]; then
            PACKAGE="@didcid/common"
          fi

          PACKAGE_DIR="${PACKAGE##*/}"
          VERSION="$(node -p "require('./packages/${PACKAGE_DIR}/package.json').version")"
          TAG="${PACKAGE}@${VERSION}"
          RELEASE_COMMIT="$(git rev-list -n 1 "$TAG")"

          echo "Publishing from $TAG at $RELEASE_COMMIT"
          git checkout --detach "$RELEASE_COMMIT"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.23.2"
          registry-url: "https://registry.npmjs.org"

      - name: Verify npm trusted publisher
        run: |
          node --input-type=module <<'JS'
          const url = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          url.searchParams.set('audience', 'npm:registry.npmjs.org');
          const identity = await fetch(url, {
            headers: { Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` },
          });
          if (!identity.ok) throw new Error(`GitHub identity request: HTTP ${identity.status}`);
          const { value } = await identity.json();
          const response = await fetch('https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/@didcid%2fcommon', {
            method: 'POST', headers: { Authorization: `Bearer ${value}` },
          });
          if (!response.ok) {
            const error = await response.json();
            console.error(`npm identity exchange: HTTP ${response.status}`, error.message || error.error || 'No diagnostic message');
            process.exit(1);
          }
          const result = await response.json();
          if (!result.token) throw new Error('npm identity exchange returned no token');
          console.log('npm accepted the trusted publisher identity for @didcid/common');
          JS

      - name: Pin npm 10.9.2
        run: npm install --global npm@10.9.2

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: npm ci

      # (Removed deprecated 'Bootstrap Lerna' step)

      - name: Run tests
        run: |
          if [ "${{ github.event.inputs.package }}" = "all" ]; then
            npx lerna run test --sort --concurrency=1
          else
            npx lerna run test --scope "${{ github.event.inputs.package }}" --include-dependencies --sort --concurrency=1
          fi

      - name: Build packages
        run: |
          if [ "${{ github.event.inputs.package }}" = "all" ]; then
            npx lerna run build --sort --concurrency=1
          else
            npx lerna run build --scope "${{ github.event.inputs.package }}" --include-dependencies --sort --concurrency=1
          fi
        continue-on-error: false

      - name: Version packages
        if: ${{ github.event.inputs.version != 'current' }}
        run: |
          # A manual dispatch is a deliberate request to bump and tag, even when
          # lerna detects no source changes since the last release tags
          # (otherwise lerna versions nothing and `publish from-git` finds no tag).
          if [ "${{ github.event.inputs.package }}" = "all" ]; then
            FORCE_FLAG="--force-publish"
          else
            FORCE_FLAG="--force-publish ${{ github.event.inputs.package }}"
          fi

          if [[ "${{ github.event.inputs.version }}" == pre* ]]; then
            npx lerna version ${{ github.event.inputs.version }} --preid ${{ github.event.inputs.preid }} --yes --no-private $FORCE_FLAG
          else
            npx lerna version ${{ github.event.inputs.version }} --yes --no-private $FORCE_FLAG
          fi

      - name: Update publishing npm
        run: npm install --global npm@11.15.0

      - name: Publish to NPM
        env:
          NPM_CONFIG_ACCESS: public
        run: |
          # Detect a no-op publish from lerna's own output: when there is no
          # tagged release it prints "No changed packages to publish" and exits
          # 0, which we must treat as a failure. (lerna 9's --summary-file is
          # unreliable here — it stays empty even on a successful publish.)
          set -o pipefail
          PUBLISH_LOG="$(mktemp)"
          MODE=from-git
          if [ "${{ github.event.inputs.version }}" = "current" ]; then
            MODE=from-package
          fi
          if [[ "${{ github.event.inputs.version }}" == pre* ]]; then
            npx lerna publish "$MODE" --dist-tag ${{ github.event.inputs.preid }} --yes --registry https://registry.npmjs.org 2>&1 | tee "$PUBLISH_LOG"
          else
            npx lerna publish "$MODE" --yes --registry https://registry.npmjs.org 2>&1 | tee "$PUBLISH_LOG"
          fi

          if ! grep -q "lerna success published" "$PUBLISH_LOG"; then
            echo "Lerna did not publish any packages."
            exit 1
          fi
