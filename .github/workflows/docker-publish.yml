name: Build & Publish

# One workflow for both channels. There used to be two -- docker-publish.yml on
# the pre-release branch and release-publish.yml on v* tags -- and they drifted:
# the release one published 6 images where pre-release published 15, and the two
# disagreed on what to call the satoshi mediator. A release therefore shipped a
# quarter of the services, and nine images had a `latest` that only ever came
# from the pre-release branch (#954).
#
# The channel decides the tags, not the workflow:
#   v* tag           -> <version> + latest
#   pre-release push -> <calver>  + pre-release

on:
  push:
    branches: [ "pre-release" ]
    tags: [ "v*" ]

  # A tag-triggered run uses the workflow file as it existed at that tag, so a
  # release published before this workflow landed cannot be completed by
  # re-running it -- the old file carries the old, shorter matrix. Dispatching
  # from a branch that has this file, against a ref that has the source, is the
  # only way to combine the two.
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref to build (tag, branch or SHA). Defaults to the dispatching ref."
        required: false
        type: string
      version:
        description: "Version tag to publish under, e.g. v0.12.0."
        required: true
        type: string
      channel:
        description: "Second tag to apply."
        required: true
        default: pre-release
        type: choice
        options: [pre-release, latest]

env:
  REGISTRY: ghcr.io

jobs:
  generate:
    runs-on: ubuntu-latest
    outputs:
      VERSION: ${{ steps.channel.outputs.version }}
      CHANNEL: ${{ steps.channel.outputs.channel }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Determine version and channel
        id: channel
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "channel=${{ inputs.channel }}" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            echo "channel=latest" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(date +'%Y.%m.%d')" >> "$GITHUB_OUTPUT"
            echo "channel=pre-release" >> "$GITHUB_OUTPUT"
          fi

  publish_images:
    runs-on: ubuntu-latest
    needs: generate
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: docker/Dockerfile.gatekeeper-ts
            image: gatekeeper-ts
            # Releases published this as plain `gatekeeper`, which reads as the
            # only one when there are two implementations. Carried as an alias
            # so existing pulls keep working.
            alias: gatekeeper
          - dockerfile: docker/Dockerfile.keymaster-ts
            image: keymaster-ts
            # As above: releases published this as plain `keymaster`.
            alias: keymaster
          - dockerfile: services/herald/Dockerfile
            image: herald
          - dockerfile: docker/Dockerfile.drawbridge
            image: drawbridge
          - dockerfile: docker/Dockerfile.hyperswarm
            image: hyperswarm-mediator
          - dockerfile: docker/Dockerfile.satoshi-wallet
            image: satoshi-wallet
          - dockerfile: docker/Dockerfile.satoshi
            image: satoshi-mediator
            # Released tags used to publish this one as `sat-mediator`, while
            # pre-release published `satoshi-mediator` -- two package names for
            # one service. `satoshi-mediator` is canonical, matching the
            # Dockerfile and every other entry; the old name is published
            # alongside it so existing pulls keep working, and can be dropped
            # once nothing is using it.
            alias: sat-mediator
          - dockerfile: docker/Dockerfile.lightning-mediator
            image: lightning-mediator
          - dockerfile: docker/Dockerfile.cli
            image: cli
          - dockerfile: docker/Dockerfile.explorer
            image: explorer
          - dockerfile: docker/Dockerfile.gatekeeper-client
            image: gatekeeper-client
          - dockerfile: docker/Dockerfile.keymaster-client
            image: keymaster-client
          - dockerfile: docker/Dockerfile.react-wallet
            image: react-wallet
          - dockerfile: docker/Dockerfile.herald-client
            image: herald-client
          - dockerfile: docker/Dockerfile.gatekeeper-client
            image: drawbridge-client
          # The twelve below were built by nothing until #954. Every Dockerfile
          # in the repo is referenced by a compose file under docker/compose/,
          # so each of these is a service somebody can bring up -- they were
          # simply absent from the matrix, which meant a change breaking one of
          # them passed every check. The bullseye -> bookworm -> trixie moves in
          # #890 and #892 crossed two Debian generations without any of them
          # being compiled once.
          - dockerfile: docker/Dockerfile.didcomm
            image: didcomm
          - dockerfile: docker/Dockerfile.keymaster-py
            image: keymaster-py
          - dockerfile: docker/Dockerfile.gatekeeper-rust
            image: gatekeeper-rs
          - dockerfile: docker/Dockerfile.pinning
            image: pinning-mediator
          # Chain mediators and their wallet sidecars. Named for the chain
          # rather than the network, the way satoshi/satoshi-wallet already are:
          # compose picks the network (eth-sepolia, sol-devnet, zcash-mainnet),
          # and one image serves all of them.
          - dockerfile: docker/Dockerfile.ethereum
            image: ethereum-mediator
          - dockerfile: docker/Dockerfile.ethereum-wallet
            image: ethereum-wallet
          - dockerfile: docker/Dockerfile.solana
            image: solana-mediator
          - dockerfile: docker/Dockerfile.solana-wallet
            image: solana-wallet
          - dockerfile: docker/Dockerfile.zcash
            image: zcash-mediator
          - dockerfile: docker/Dockerfile.zcash-wallet
            image: zcash-wallet
          - dockerfile: docker/Dockerfile.filecoin
            image: filecoin-mediator
          - dockerfile: docker/Dockerfile.filecoin-wallet
            image: filecoin-wallet
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ inputs.ref || github.ref }}

      # Read the commit from the checkout rather than from the event. On a
      # dispatch, github.sha is the branch the workflow file came from, not the
      # ref being built -- so a backfill of an older release stamped its images
      # with the commit of whatever main happened to be, in both GIT_COMMIT and
      # the OCI revision label. The services report that value at runtime, so
      # the image claimed a commit it was not built from. Equal to github.sha on
      # a push, so this is only ever more correct.
      - name: Record the commit actually built
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # arm64 RUN steps execute under emulation on an amd64 runner, so binfmt
      # has to be registered before buildx. Both workflows this replaces had
      # this step; the build-only workflow does not, because it is
      # single-platform, and rebuilding from that base lost it.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.23.2"

      - name: Prefetch native prebuilds
        run: node scripts/prefetch-prebuilds.mjs

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          # A second line appears only for an entry carrying an alias; the
          # action drops the empty one otherwise. One build, pushed under both
          # names, rather than building the same image twice.
          images: |
            ${{ env.REGISTRY }}/archetech/${{ matrix.image }}
            ${{ matrix.alias && format('{0}/archetech/{1}', env.REGISTRY, matrix.alias) || '' }}
          tags: |
            type=raw,value=${{ needs.generate.outputs.VERSION }}
            type=raw,value=${{ needs.generate.outputs.CHANNEL }}
          labels: |
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}

      - name: Build and push Docker images
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            GIT_COMMIT=${{ steps.source.outputs.sha }}

      - name: Run Anchore vulnerability scanner
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2
        with:
          image: ${{ env.REGISTRY }}/archetech/${{ matrix.image }}:${{
            needs.generate.outputs.VERSION }}
          fail-build: false
          severity-cutoff: critical
          output-format: table
