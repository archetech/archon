name: Build Docker images

on:
  push:

env:
  REGISTRY: ghcr.io

# Superseding pushes make earlier runs irrelevant: only the head commit's checks
# gate a merge. Cancelling them on branches keeps a rapidly-iterated PR from
# holding runners for commits nobody will merge. main is never cancelled, so its
# builds and scans always complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  generate:
    runs-on: ubuntu-latest
    outputs:
      CALVER: ${{ steps.calculate-calver.outputs.calver }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Calculate Calver
        id: calculate-calver
        run: |
          calver=$(date +'%Y.%m.%d')
          echo "calver=$calver" >> $GITHUB_OUTPUT

  # The only job that builds for a foreign architecture. Without it, a change
  # breaking the cross-compile is invisible until a release, since publishing is
  # the only other thing that targets arm64.
  #
  # No scan and no load: both need the image in the local daemon, which a
  # foreign-architecture build cannot provide. Compiling is what is checked.
  cross_compile_arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.23.2"

      # This image is Rust and never runs npm ci, so it consumes nothing from
      # ./prebuilds. Seeded anyway because the rule is per job, not per
      # Dockerfile: a job that builds images seeds first, so that adding an
      # npm-based image to a job cannot quietly land without it (#913).
      - name: Prefetch native prebuilds
        run: node scripts/prefetch-prebuilds.mjs

      - name: Cross-compile the Rust gatekeeper for arm64
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: docker/Dockerfile.gatekeeper-rust
          platforms: linux/arm64
          # Stops at the builder stage, which is the only one this job is
          # asking about. Going further would run the runtime stage's apt-get
          # under emulation -- 152s of it, to reach a COPY. The full image for
          # this platform is assembled by the publish workflow, and the runtime
          # stage is exercised natively by the amd64 leg below.
          target: builder
          push: false
          cache-from: type=gha,scope=gatekeeper-rs-arm64
          cache-to: type=gha,mode=min,scope=gatekeeper-rs-arm64

  build_test_images:
    runs-on: ubuntu-latest
    needs: generate
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: docker/Dockerfile.gatekeeper-ts
            image: gatekeeper-ts
          - dockerfile: docker/Dockerfile.keymaster-ts
            image: keymaster-ts
          - dockerfile: services/herald/Dockerfile
            image: herald
          - dockerfile: docker/Dockerfile.drawbridge
            image: drawbridge
          - dockerfile: docker/Dockerfile.hyperswarm
            image: hyperswarm-mediator
          - dockerfile: docker/Dockerfile.satoshi-wallet
            image: satoshi-wallet
          - dockerfile: docker/Dockerfile.satoshi
            image: satoshi-mediator
          - dockerfile: docker/Dockerfile.lightning-mediator
            image: lightning-mediator
          - dockerfile: docker/Dockerfile.cli
            image: cli
          - dockerfile: docker/Dockerfile.explorer
            image: explorer
          - dockerfile: docker/Dockerfile.gatekeeper-client
            image: gatekeeper-client
          - dockerfile: docker/Dockerfile.keymaster-client
            image: keymaster-client
          - dockerfile: docker/Dockerfile.react-wallet
            image: react-wallet
          - dockerfile: docker/Dockerfile.herald-client
            image: herald-client
          - dockerfile: docker/Dockerfile.gatekeeper-client
            image: drawbridge-client
          # The twelve below were built by nothing until #954. Every Dockerfile
          # in the repo is referenced by a compose file under docker/compose/,
          # so each of these is a service somebody can bring up -- they were
          # simply absent from the matrix, which meant a change breaking one of
          # them passed every check. The bullseye -> bookworm -> trixie moves in
          # #890 and #892 crossed two Debian generations without any of them
          # being compiled once.
          - dockerfile: docker/Dockerfile.didcomm
            image: didcomm
          - dockerfile: docker/Dockerfile.keymaster-py
            image: keymaster-py
          - dockerfile: docker/Dockerfile.gatekeeper-rust
            image: gatekeeper-rs
          - dockerfile: docker/Dockerfile.pinning
            image: pinning-mediator
          # Chain mediators and their wallet sidecars. Named for the chain
          # rather than the network, the way satoshi/satoshi-wallet already are:
          # compose picks the network (eth-sepolia, sol-devnet, zcash-mainnet),
          # and one image serves all of them.
          - dockerfile: docker/Dockerfile.ethereum
            image: ethereum-mediator
          - dockerfile: docker/Dockerfile.ethereum-wallet
            image: ethereum-wallet
          - dockerfile: docker/Dockerfile.solana
            image: solana-mediator
          - dockerfile: docker/Dockerfile.solana-wallet
            image: solana-wallet
          - dockerfile: docker/Dockerfile.zcash
            image: zcash-mediator
          - dockerfile: docker/Dockerfile.zcash-wallet
            image: zcash-wallet
          - dockerfile: docker/Dockerfile.filecoin
            image: filecoin-mediator
          - dockerfile: docker/Dockerfile.filecoin-wallet
            image: filecoin-wallet
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      # Required for the GitHub Actions layer cache below: the default docker
      # driver cannot export cache, only the docker-container driver can.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.23.2"

      - name: Prefetch native prebuilds
        run: node scripts/prefetch-prebuilds.mjs

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ env.REGISTRY }}/archetech/${{ matrix.image }}
          tags: |
            type=raw,value=${{ needs.generate.outputs.CALVER }}
            type=raw,value=latest

      - name: Build Docker images
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          # The buildx docker-container driver keeps the result in its own
          # cache, so the image has to be loaded into the docker daemon for the
          # Anchore scan below to find it. Valid here because this is a
          # single-platform build.
          load: true
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          # Scoped per image so the 15 matrix legs don't evict each other. These
          # are single-stage builds, so mode=min still covers the `npm ci` layer
          # and keeps us well inside the repo's 10GB Actions cache budget.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=min,scope=${{ matrix.image }}

      - name: Run Anchore vulnerability scanner
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439
        with:
          image: ${{ env.REGISTRY }}/archetech/${{ matrix.image }}:${{
            needs.generate.outputs.CALVER }}
          fail-build: false
          severity-cutoff: critical
          output-format: table

  # A single context for branch protection to require. The matrix is 27 legs and
  # grows with every new Dockerfile, so requiring the legs themselves would mean
  # editing branch protection each time one is added -- the reason the sibling
  # workflow rolls its matrix up the same way. arm64 is deliberately outside it:
  # the nightly multi-platform run builds every image for linux/arm64.
  image_build_result:
    name: image build result
    if: always()
    needs: build_test_images
    runs-on: ubuntu-latest
    steps:
      - name: Verify every image built
        run: |
          result="${{ needs.build_test_images.result }}"
          if [ "$result" != "success" ]; then
            echo "build_test_images did not succeed (result: $result)"
            exit 1
          fi
          echo "All image builds passed"
