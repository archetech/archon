name: Lockfile Consistency

on:
  pull_request:

# Superseding pushes make earlier runs irrelevant: only the head commit's checks
# gate a merge. Cancelling them on branches keeps a rapidly-iterated PR from
# holding runners for commits nobody will merge. main is never cancelled, so its
# builds and scans always complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  lockfile-consistency:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Ensure package manifests update lockfiles together
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          changed_manifests="$(printf '%s\n' "$changed_files" | grep -E '(^|/)package\.json$' || true)"

          if [ -z "$changed_manifests" ]; then
            exit 0
          fi

          missing_lockfiles=""

          while IFS= read -r manifest; do
            [ -z "$manifest" ] && continue
            dir="$(dirname "$manifest")"

            # Skip manifests whose dependency-relevant fields are unchanged.
            # The lockfile only tracks resolution fields (name, version,
            # dependency maps, engines, bin, os, cpu, workspaces, overrides),
            # so edits limited to metadata (bugs, homepage, description,
            # keywords, scripts, ...) cannot change it and must not be gated.
            # Added/removed manifests or parse failures fall through and are
            # still required to update the lockfile.
            base_manifest="$(git show "$BASE_SHA:$manifest" 2>/dev/null || true)"
            head_manifest="$(git show "$HEAD_SHA:$manifest" 2>/dev/null || true)"
            if [ -n "$base_manifest" ] && [ -n "$head_manifest" ]; then
              relevant='{name, version, dependencies, devDependencies, peerDependencies, optionalDependencies, peerDependenciesMeta, bundleDependencies, bundledDependencies, workspaces, overrides, engines, bin, os, cpu}'
              base_relevant="$(printf '%s' "$base_manifest" | jq -S "$relevant" 2>/dev/null || echo base-parse-error)"
              head_relevant="$(printf '%s' "$head_manifest" | jq -S "$relevant" 2>/dev/null || echo head-parse-error)"
              if [ "$base_relevant" = "$head_relevant" ]; then
                echo "Skipping $manifest (no dependency-relevant changes)"
                continue
              fi
            fi

            if [ "$manifest" = "package.json" ]; then
              lockfile="package-lock.json"
            elif [ -f "$dir/package-lock.json" ] || git show "$BASE_SHA:$dir/package-lock.json" >/dev/null 2>&1; then
              # Nested package with its own lockfile (present now, or in base —
              # the latter covers a package removed together with its lockfile,
              # which must map to the sibling lockfile, not the root one).
              lockfile="$dir/package-lock.json"
            else
              lockfile="package-lock.json"
            fi

            if printf '%s\n' "$changed_files" | grep -Fxq "$lockfile"; then
              continue
            fi

            missing_lockfiles="${missing_lockfiles}${lockfile}\n"
          done <<EOF
          $changed_manifests
          EOF

          if [ -n "$missing_lockfiles" ]; then
            echo "The following lockfiles must be updated alongside package.json changes:"
            printf '%b' "$missing_lockfiles"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.23.2"

      - name: Pin npm 10.9.2
        run: npm install --global npm@10.9.2

      # A lockfile can satisfy the pairing above and still be unusable: a
      # regeneration that prunes a nested version leaves an incompatible hoisted
      # one behind, and npm ci refuses to install it. Resolving each changed
      # lockfile reports that here rather than minutes later in the jobs that
      # build from it.
      - name: Resolve every changed lockfile
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed_lockfiles="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -E '(^|/)package-lock\.json$' || true)"

          if [ -z "$changed_lockfiles" ]; then
            echo "No lockfiles changed."
            exit 0
          fi

          failed=""

          while IFS= read -r lockfile; do
            [ -z "$lockfile" ] && continue

            # A lockfile deleted in this PR has nothing left to resolve.
            [ -f "$lockfile" ] || continue

            dir="$(dirname "$lockfile")"
            echo "::group::npm ci --dry-run in $dir"
            if ! (cd "$dir" && npm ci --dry-run --ignore-scripts); then
              failed="${failed}${lockfile}\n"
            fi
            echo "::endgroup::"
          done <<EOF
          $changed_lockfiles
          EOF

          if [ -n "$failed" ]; then
            echo "These lockfiles cannot be installed with npm ci:"
            printf '%b' "$failed"
            echo "Regenerate them with npm install rather than editing by hand."
            exit 1
          fi
