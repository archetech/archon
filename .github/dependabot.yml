version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "America/Toronto"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
    commit-message:
      prefix: "ci"
    groups:
      github-actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/demo/commonjs-demo"
      - "/apps/browser-extension"
      - "/apps/gatekeeper-client"
      - "/apps/herald-client"
      - "/apps/keymaster-client"
      - "/apps/react-wallet"
      - "/services/drawbridge/server"
      - "/services/explorer"
      - "/services/gatekeeper/server"
      - "/services/herald"
      - "/services/herald/server"
      - "/services/keymaster/server"
      - "/services/mediators/hyperswarm"
      - "/services/mediators/satoshi"
      - "/services/mediators/solana"
      - "/services/mediators/solana-wallet"
      - "/services/satoshi-wallet/server"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "America/Toronto"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "deps"
    groups:
      npm_and_yarn:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Core Lightning releases, for the ghcr.io/archetech/cln base image. Only
  # this image is allowed: the other Dockerfiles' bases are not managed here.
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "America/Toronto"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
    allow:
      - dependency-name: "elementsproject/lightningd"
