# Shared CLN image. The node and its one-shot rune-init containers (drawbridge-init,
# rtl-init, lnbits-init) MUST run the same image so the init `lightning-cli` always
# matches the running lightningd. The CLN version is the base image in
# docker/Dockerfile.cln; each service can build it, so a node running from a
# checkout builds the image rather than failing to pull an unpublished one.
x-cln: &cln
  image: ghcr.io/archetech/cln
  build:
    context: ../..
    dockerfile: docker/Dockerfile.cln

services:
  cln-mainnet-node:
    profiles: ["lightning"]
    <<: *cln
    environment:
      - NETWORK=bitcoin
      - ALIAS=${ARCHON_CLN_ALIAS:-archon}
      - RGB=${ARCHON_CLN_RGB:-e33502}
      - BITCOIN_RPCHOST=${ARCHON_BTC_HOST}
      - BITCOIN_RPCPORT=${ARCHON_BTC_PORT:-8332}
      - BITCOIN_RPCUSER=${ARCHON_BTC_USER}
      - BITCOIN_RPCPASSWORD=${ARCHON_BTC_PASS}
      - LIGHTNING_PORT=${ARCHON_CLN_PORT:-9736}
      - NETWORK_MODE=${ARCHON_CLN_NETWORK_MODE:-tor}
      - ANNOUNCE_ADDR=${ARCHON_CLN_ANNOUNCE_ADDR:-}
      # Checked against NETWORK_MODE: a tor-mode node refuses to start when its
      # P2P port is published beyond loopback.
      - P2P_BIND=${ARCHON_CLN_P2P_BIND:-}
      - MIN_CAPACITY_SAT=${ARCHON_CLN_MIN_CAPACITY_SAT:-50000}
      - LOG_LEVEL=${ARCHON_CLN_LOG_LEVEL:-info}
    volumes:
      - ../../data/cln-mainnet:/data/lightning
      # The onion key directory the tor service serves CLN from (TOR_SERVICES
      # in drawbridge.yml). Tor writes its hostname from the key there, which
      # the entrypoint announces in tor and hybrid modes.
      - ../../data/cln-mainnet/tor/cln-service:/tor/cln-service:ro
    networks:
      default:
        aliases:
          - cln
    ports:
      # Loopback by default: in tor mode lightningd listens on the container
      # network for Tor, and a public publication would also accept clearnet
      # peers on the host's address. Set ARCHON_CLN_P2P_BIND=0.0.0.0 for
      # clearnet and hybrid modes.
      - "${ARCHON_CLN_P2P_BIND:-127.0.0.1}:${ARCHON_CLN_PORT:-9736}:${ARCHON_CLN_PORT:-9736}"
      - "127.0.0.1:3001:3001"
    # No depends_on: tor. The entrypoint waits for tor itself; a compose
    # dependency would close a cycle, because drawbridge waits for this node
    # through lightning-mediator and drawbridge-init.
    restart: unless-stopped
    # Time for lightningd to finish HTLCs and flush its database on stop.
    stop_grace_period: 120s

  drawbridge-init:
    profiles: ["lightning"]
    <<: *cln
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        RUNE_FILE=/data/lightning/drawbridge/rune.txt
        RPC_SOCKET=/data/lightning/bitcoin/bitcoin/lightning-rpc

        if [ -f "$$RUNE_FILE" ]; then
            echo "[drawbridge-init] Rune already exists, skipping"
            exit 0
        fi

        echo "[drawbridge-init] Waiting for lightningd..."
        timeout=600; elapsed=0
        while ! lightning-cli --conf=/dev/null --rpc-file="$$RPC_SOCKET" getinfo >/dev/null 2>&1; do
            sleep 2; elapsed=$$((elapsed + 2))
            if [ $$elapsed -ge $$timeout ]; then
                echo "[drawbridge-init] ERROR: lightningd not ready after $${timeout}s"
                exit 1
            fi
        done

        echo "[drawbridge-init] Creating rune..."
        set -euo pipefail
        mkdir -p /data/lightning/drawbridge
        RUNE=$$(lightning-cli --conf=/dev/null --rpc-file="$$RPC_SOCKET" createrune \
            restrictions='[["method^invoice","method^listinvoices"]]' \
            | jq -er '.rune | select(type == "string" and length > 0)')

        # Written whole or not at all: the check above skips any file present.
        echo "LIGHTNING_RUNE=\"$$RUNE\"" > "$$RUNE_FILE.tmp"
        mv "$$RUNE_FILE.tmp" "$$RUNE_FILE"
        echo "[drawbridge-init] Rune created successfully (restricted to invoice methods)"
    volumes:
      - ../../data/cln-mainnet:/data/lightning
    depends_on:
      - cln-mainnet-node
    restart: "no"

  rtl-init:
    profiles: ["lightning"]
    <<: *cln
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        RUNE_FILE=/data/lightning/rtl/rune.txt
        RPC_SOCKET=/data/lightning/bitcoin/bitcoin/lightning-rpc

        if [ -f "$$RUNE_FILE" ]; then
            echo "[rtl-init] Rune already exists, skipping"
            exit 0
        fi

        echo "[rtl-init] Waiting for lightningd..."
        timeout=600; elapsed=0
        while ! lightning-cli --conf=/dev/null --rpc-file="$$RPC_SOCKET" getinfo >/dev/null 2>&1; do
            sleep 2; elapsed=$$((elapsed + 2))
            if [ $$elapsed -ge $$timeout ]; then
                echo "[rtl-init] ERROR: lightningd not ready after $${timeout}s"
                exit 1
            fi
        done

        echo "[rtl-init] Creating rune..."
        set -euo pipefail
        mkdir -p /data/lightning/rtl
        RUNE=$$(lightning-cli --conf=/dev/null --rpc-file="$$RPC_SOCKET" createrune \
            | jq -er '.rune | select(type == "string" and length > 0)')

        # Written whole or not at all: the check above skips any file present.
        echo "LIGHTNING_RUNE=\"$$RUNE\"" > "$$RUNE_FILE.tmp"
        mv "$$RUNE_FILE.tmp" "$$RUNE_FILE"
        echo "[rtl-init] Rune created successfully"
    volumes:
      - ../../data/cln-mainnet:/data/lightning
    depends_on:
      - cln-mainnet-node
    restart: "no"

  rtl:
    profiles: ["lightning"]
    image: shahanafarooqui/rtl:0.15.1
    entrypoint: ["/bin/sh", "/scripts/rtl-entrypoint.sh"]
    environment:
      - RTL_CONFIG_PATH=/data
      - CLN_REST_HOST=cln
      - CLN_REST_PORT=3001
      - RTL_NODE_NAME=${ARCHON_CLN_ALIAS:-archon}
      - RTL_PASSWORD=${ARCHON_RTL_PASSWORD:-changeme}
    volumes:
      - ../../scripts/rtl-entrypoint.sh:/scripts/rtl-entrypoint.sh:ro
      - ../../data/cln-mainnet/rtl:/data
    ports:
      # Loopback by default: an admin UI, and Docker publishes ports ahead of
      # the host firewall, so a public bind is invisible to UFW. Set
      # ARCHON_RTL_BIND=0.0.0.0 to expose it deliberately.
      - "${ARCHON_RTL_BIND:-127.0.0.1}:${ARCHON_RTL_PORT:-3002}:3000"
    depends_on:
      rtl-init:
        condition: service_completed_successfully
      cln-mainnet-node:
        condition: service_started

  lnbits-init:
    profiles: ["lightning"]
    <<: *cln
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        RUNE_DIR=/data/lightning/lnbits
        RUNE_FILE=$$RUNE_DIR/runes.env
        RPC_SOCKET=/data/lightning/bitcoin/bitcoin/lightning-rpc
        CERT_DIR=/data/lightning/bitcoin/bitcoin

        if [ -f "$$RUNE_FILE" ]; then
            echo "[lnbits-init] Runes already exist, skipping"
            exit 0
        fi

        echo "[lnbits-init] Waiting for lightningd..."
        timeout=600; elapsed=0
        while ! lightning-cli --conf=/dev/null --rpc-file="$$RPC_SOCKET" getinfo >/dev/null 2>&1; do
            sleep 2; elapsed=$$((elapsed + 2))
            if [ $$elapsed -ge $$timeout ]; then
                echo "[lnbits-init] ERROR: lightningd not ready after $${timeout}s"
                exit 1
            fi
        done

        echo "[lnbits-init] Creating runes..."
        set -euo pipefail
        mkdir -p "$$RUNE_DIR"

        READONLY=$$(lightning-cli --conf=/dev/null --rpc-file="$$RPC_SOCKET" createrune \
            restrictions='[["method=listfunds","method=listpays","method=listinvoices","method=getinfo","method=summary","method=waitanyinvoice"]]' \
            | jq -er '.rune | select(type == "string" and length > 0)')

        INVOICE=$$(lightning-cli --conf=/dev/null --rpc-file="$$RPC_SOCKET" createrune \
            restrictions='[["method=invoice"],["rate=120"]]' \
            | jq -er '.rune | select(type == "string" and length > 0)')

        PAY=$$(lightning-cli --conf=/dev/null --rpc-file="$$RPC_SOCKET" createrune \
            restrictions='[["method=pay"],["rate=30"]]' \
            | jq -er '.rune | select(type == "string" and length > 0)')

        {
            echo "CLNREST_READONLY_RUNE=\"$$READONLY\""
            echo "CLNREST_INVOICE_RUNE=\"$$INVOICE\""
            echo "CLNREST_PAY_RUNE=\"$$PAY\""
        } > "$$RUNE_FILE.tmp"

        # Copy TLS certs so LNbits can read them
        if [ -f "$$CERT_DIR/ca.pem" ]; then
            cp "$$CERT_DIR/ca.pem" "$$RUNE_DIR/ca.pem"
            cp "$$CERT_DIR/server.pem" "$$RUNE_DIR/server.pem"
            echo "[lnbits-init] TLS certs copied"
        else
            echo "[lnbits-init] WARNING: TLS certs not found at $$CERT_DIR"
        fi

        # Written last and whole: the check above skips any file present, and
        # the certs have to be in place before it is.
        mv "$$RUNE_FILE.tmp" "$$RUNE_FILE"
        echo "[lnbits-init] Runes created successfully"
    volumes:
      - ../../data/cln-mainnet:/data/lightning
    depends_on:
      - cln-mainnet-node
    restart: "no"

  lnbits:
    profiles: ["lightning"]
    image: ghcr.io/archetech/lnbits:1.5.3-archetech.1
    entrypoint: ["/bin/sh", "/scripts/lnbits-entrypoint.sh"]
    environment:
      - LNBITS_HOST=0.0.0.0
      - LNBITS_PORT=5000
      - LNBITS_ADMIN_UI=true
      - LNBITS_BACKEND_WALLET_CLASS=CLNRestWallet
      - CLNREST_URL=https://cln:3001
      - CLNREST_CA=/data/lightning/lnbits/ca.pem
      - LNBITS_CLNREST_WAIT_TIMEOUT=${ARCHON_LNBITS_CLNREST_WAIT_TIMEOUT:-600}
      - LNBITS_DATA_FOLDER=/data/lnbits
      - FORWARDED_ALLOW_IPS=*
      - AUTH_SECRET_KEY=${ARCHON_LNBITS_AUTH_SECRET:-}
    volumes:
      - ../../scripts/lnbits-entrypoint.sh:/scripts/lnbits-entrypoint.sh:ro
      - ../../data/cln-mainnet:/data/lightning:ro
      - ../../data/lnbits:/data/lnbits
    ports:
      # Loopback by default: the custodial wallet admin UI
      # (LNBITS_ADMIN_UI=true), and Docker publishes ports ahead of the host
      # firewall. Set ARCHON_LNBITS_BIND=0.0.0.0 to expose it deliberately.
      - "${ARCHON_LNBITS_BIND:-127.0.0.1}:${ARCHON_LNBITS_PORT:-5000}:5000"
    depends_on:
      lnbits-init:
        condition: service_completed_successfully
      cln-mainnet-node:
        condition: service_started
