services:
  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v2.51.0
    user: "${ARCHON_UID}:${ARCHON_GID}"
    volumes:
      - ../../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ../../data/prometheus:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    depends_on:
      gatekeeper:
        condition: service_healthy

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:10.4.0
    user: "${ARCHON_UID}:${ARCHON_GID}"
    volumes:
      - ../../observability/grafana/provisioning:/etc/grafana/provisioning
      - ../../data/grafana:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_USERS_DEFAULT_THEME=dark
    ports:
      # Loopback by default: an admin UI, and Docker publishes ports ahead of
      # the host firewall, so a public bind is invisible to UFW. Set
      # ARCHON_GRAFANA_BIND=0.0.0.0 to expose it deliberately.
      - "${ARCHON_GRAFANA_BIND:-127.0.0.1}:${ARCHON_GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
